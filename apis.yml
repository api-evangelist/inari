aid: inari
name: Inari
description: 'Inari Agriculture, Inc. — "The SEEDesign company" — is a Cambridge, Massachusetts
  agricultural biotechnology company founded by Flagship Pioneering in 2016, with additional
  sites in West Lafayette, Indiana and Ghent, Belgium. Its SEEDesign platform combines
  genomics, artificial intelligence and predictive design with a multiplex gene-editing
  toolbox to accelerate crop improvement in soybean, corn and wheat, targeting 10-20%
  yield gains alongside roughly 40% reductions in nitrogen and water use. Inari runs
  a partner-first, business-to-business model, licensing designed seed to independent
  seed companies and breeders rather than selling to farmers directly. Inari publishes
  an llms.txt at inari.com/llms.txt but operates no public developer program, API,
  or machine-readable API contract; its data platform (Databricks-based) is internal.
  Not to be confused with the unrelated medical-device company Inari Medical.'
